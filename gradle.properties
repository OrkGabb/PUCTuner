org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.3 foi testado até compileSdk 35; usamos 36 (Android 16) e compila/roda ok.
# Silencia o aviso "untested compileSdk" (recomendação do próprio Google). Se um dia bumpar
# o AGP para uma versão que suporte 36 oficialmente (+ Gradle compatível), pode remover.
android.suppressUnsupportedCompileSdk=36
